<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAMN!!!!!!!!!!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#eef1f3; --surface:#ffffff; --surface2:#f5f7f8; --ink:#14232b; --muted:#5b6b74;
  --line:#d5dde1; --accent:#c2410c; --accent-soft:#fbe3d6; --teal:#0f6b6f; --ok:#17693a;
  --font-display:'IBM Plex Sans Condensed','Arial Narrow',Arial,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f181d; --surface:#17232a; --surface2:#1d2c34; --ink:#e6edf0; --muted:#97a8b1;
    --line:#2b3c45; --accent:#f08a4b; --accent-soft:#3a2418; --teal:#4fc1c5; --ok:#5fcf8a; color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;margin:0}
.wrap{max-width:1280px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.1;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0;font-family:var(--font-mono);font-size:12px;overflow-wrap:anywhere}
.drop{display:flex;flex-wrap:wrap;align-items:center;gap:14px;border:1.5px dashed var(--muted);border-radius:6px;padding:16px;background:var(--surface);transition:background .15s,border-color .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .txt{flex:1 1 260px;min-width:0}
.drop strong{font-family:var(--font-display);font-size:17px;font-weight:600}
.drop p{margin:2px 0 0;color:var(--muted)}
button,.btn{font:inherit;font-weight:500;border-radius:5px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:8px 14px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#status{font-family:var(--font-mono);font-size:12.5px;min-height:18px;color:var(--muted)}
#status.err{color:var(--accent)} #status.ok{color:var(--ok)}
.main{display:grid;grid-template-columns:320px 1fr;gap:14px;min-width:0}
@media (max-width:860px){.main{grid-template-columns:1fr}}
.side{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tools{display:flex;flex-direction:column;gap:8px}
input[type=search],select{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:7px 9px;width:100%}
.count{color:var(--muted);font-size:12.5px}
.list{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:5px}
.item{padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.item:hover,.item:focus-visible{background:var(--accent-soft)}
.item b{font-family:var(--font-mono);font-size:12.5px;font-weight:500}
.item small{color:var(--muted);display:block;font-size:11.5px}
.item .m{font-family:var(--font-mono);font-size:12.5px;white-space:nowrap}
.item .none{color:var(--accent)}
#map{height:600px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);z-index:0}
.empty{position:relative}
.pop h3{font-family:var(--font-display);font-size:16px;margin:0 0 6px}
.pop table{border-collapse:collapse;font-size:12.5px}
.pop td{padding:2px 8px 2px 0;vertical-align:top}
.pop td:first-child{color:#5b6b74}
.pop .len{font-family:var(--font-mono);font-weight:600;color:#c2410c;font-size:15px}
.pop .warn{color:#c2410c}
#scare{position:fixed;inset:0;z-index:99999;background:#000;display:none;align-items:center;justify-content:center;cursor:pointer}
#scare.on{display:flex;animation:sc-flash .35s steps(2) 1}
#scare img{max-width:96vw;max-height:96vh;width:auto;height:auto;object-fit:contain;animation:sc-zoom .25s ease-out forwards,sc-shake .08s linear .25s infinite}
@keyframes sc-zoom{from{transform:scale(.2)}to{transform:scale(1.15)}}
@keyframes sc-shake{0%{transform:translate(0,0) scale(1.15)}25%{transform:translate(-14px,8px) scale(1.15)}50%{transform:translate(12px,-10px) scale(1.15)}75%{transform:translate(-8px,-6px) scale(1.15)}100%{transform:translate(10px,10px) scale(1.15)}}
@keyframes sc-flash{0%{background:#b00}100%{background:#000}}
@media (prefers-reduced-motion:reduce){#scare.on,#scare img{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>DAMNNNN!!!!!</h1>
    <p class="sub" id="src">BELUM ADA FILE DI MUAT</p>
  </header>

  <section class="drop" id="drop" aria-label="Unggah file KMZ">
    <div class="txt">
      <strong>MASUKAN BOLA DUNIA NYA</strong>
      <p>TARIK FILE NYA</p>
      <div id="status" role="status">Unggah file KMZ/KML, lalu klik titik homepass untuk melihat pop up.</div>
    </div>
    <input id="file" type="file" accept=".kmz,.kml,application/vnd.google-earth.kmz,application/vnd.google-earth.kml+xml" hidden>
    <label for="file" class="btn" id="pick" tabindex="0" role="button">PILIH DEH FILE NYEEE</label>
  </section>

  <section class="main">
    <aside class="side">
      <div class="tools">
        <input id="q" type="search" placeholder="Cari nomor rumah, FAT, jalan" aria-label="Cari">
        <select id="fatSel" aria-label="Filter FAT"><option value="">Semua FAT</option></select>
        <span class="count" id="cnt"></span>
        <button type="button" id="csvBtn" disabled>Simpan CSV</button>
        <button type="button" id="kmzBtn" disabled>Simpan KMZ (dengan pop up)</button>
      </div>
      <div class="list" id="list"></div>
    </aside>
    <div id="map"></div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const fmt = (n,d=2) => n.toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const natural = new Intl.Collator('id',{numeric:true,sensitivity:'base'});

let homes = [], cables = [], fileName = '', map, layer, lines, markers = new Map();

/* ---------- geodesic length (Vincenty, WGS84) ---------- */
function dist(p1,p2){
  const a=6378137, f=1/298.257223563, b=a*(1-f), rad=Math.PI/180;
  if(p1[0]===p2[0]&&p1[1]===p2[1]) return 0;
  const U1=Math.atan((1-f)*Math.tan(p1[1]*rad)), U2=Math.atan((1-f)*Math.tan(p2[1]*rad));
  const L=(p2[0]-p1[0])*rad; let lam=L, sS,cS,s,c2a,c2sm;
  for(let i=0;i<200;i++){
    sS=Math.hypot(Math.cos(U2)*Math.sin(lam),Math.cos(U1)*Math.sin(U2)-Math.sin(U1)*Math.cos(U2)*Math.cos(lam));
    cS=Math.sin(U1)*Math.sin(U2)+Math.cos(U1)*Math.cos(U2)*Math.cos(lam);
    s=Math.atan2(sS,cS);
    const sa=Math.cos(U1)*Math.cos(U2)*Math.sin(lam)/sS; c2a=1-sa*sa;
    c2sm=c2a?cS-2*Math.sin(U1)*Math.sin(U2)/c2a:0;
    const C=f/16*c2a*(4+f*(4-3*c2a)), lp=lam;
    lam=L+(1-C)*f*sa*(s+C*sS*(c2sm+C*cS*(-1+2*c2sm*c2sm)));
    if(Math.abs(lam-lp)<1e-12) break;
  }
  const u2=c2a*(a*a-b*b)/(b*b);
  const A=1+u2/16384*(4096+u2*(-768+u2*(320-175*u2)));
  const B=u2/1024*(256+u2*(-128+u2*(74-47*u2)));
  const ds=B*sS*(c2sm+B/4*(cS*(-1+2*c2sm*c2sm)-B/6*c2sm*(-3+4*sS*sS)*(-3+4*c2sm*c2sm)));
  return b*A*(s-ds);
}
const flat=(p,q)=>Math.hypot((p[0]-q[0])*110500,(p[1]-q[1])*111320);

/* ---------- KML parsing ---------- */
const kids=(el,t)=>Array.from(el.children).filter(c=>c.localName===t);
const nameOf=el=>{const n=kids(el,'name')[0];return n?n.textContent.trim():''};
function coords(pm){
  const c=pm.getElementsByTagNameNS('*','coordinates')[0]; if(!c) return [];
  return c.textContent.trim().split(/\s+/).map(s=>s.split(',').slice(0,2).map(Number)).filter(p=>p.length===2&&!p.some(isNaN));
}
function attrs(pm){
  const o={};
  for(const s of pm.getElementsByTagNameNS('*','SimpleData'))o[s.getAttribute('name')]=s.textContent.trim();
  for(const d of pm.getElementsByTagNameNS('*','Data')){const v=d.getElementsByTagNameNS('*','value')[0];o[d.getAttribute('name')]=v?v.textContent.trim():''}
  return o;
}
const blockOf=a=>{for(const k of Object.keys(a)) if(/bl(o)?c?k/i.test(k)&&a[k]) return a[k]; return ''};

function parseKml(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.getElementsByTagNameNS('*','parsererror').length) throw new Error('Isi KML tidak bisa dibaca.');
  const folders=Array.from(doc.getElementsByTagNameNS('*','Folder'));
  const byName=re=>folders.filter(f=>re.test(nameOf(f)));
  const drop=byName(/^cable[\s_-]*drop$/i)[0];
  if(!drop) throw new Error('Folder "CABLE DROP" tidak ditemukan. Folder yang ada: '+folders.map(nameOf).join(', '));

  // Folder "HP": sumber nama BLOCK tiap homepass
  const HP=[]; let hpKeys=[];
  for(const f of byName(/^hp$/i)) for(const pm of f.getElementsByTagNameNS('*','Placemark')){
    const c=coords(pm)[0]; if(!c) continue; const a=attrs(pm);
    if(!hpKeys.length) hpKeys=Object.keys(a);
    HP.push({name:nameOf(pm),pt:c,a,block:blockOf(a)});
  }
  const streetOf=a=>((a.PREFIX_ADDRESS||'')+' '+(a.STREET_NAME||'')).trim()||'-';
  const H=[];
  for(const f of byName(/^home(-biz)?$/i)) for(const pm of f.getElementsByTagNameNS('*','Placemark')){
    const c=coords(pm)[0]; if(!c) continue; const a=attrs(pm);
    H.push({name:nameOf(pm),pt:c,street:streetOf(a),fat:a.FAT_CODE||'',block:blockOf(a),cables:[]});
  }
  if(!H.length) for(const p of HP) H.push({name:p.name,pt:p.pt,street:streetOf(p.a),fat:p.a.FAT_CODE||'',block:p.block,cables:[]});
  else for(const h of H){
    if(h.block) continue;
    let best=null,bd=1e9;
    for(const p of HP){ if(!p.block) continue; const d=flat(p.pt,h.pt), same=p.name===h.name;
      if((d<=8||(same&&d<40))&&d<bd){bd=d;best=p} }
    if(best) h.block=best.block;
  }
  if(!H.length) throw new Error('Folder HP / HOME (homepass) tidak ditemukan atau kosong.');
  const fats=[];
  for(const f of byName(/^fat$/i)) for(const pm of f.getElementsByTagNameNS('*','Placemark')){
    const c=coords(pm)[0]; if(c) fats.push({name:nameOf(pm),pt:c});
  }

  const C=[];
  for(const pm of drop.getElementsByTagNameNS('*','Placemark')){
    const pts=coords(pm); if(pts.length<2) continue;
    const cable=nameOf(pm); const m=cable.match(/^cable_(.+)_(FOB\w+)$/i);
    let house=m?m[1]:'', fat=m?m[2]:'';
    const ends=[pts[0],pts[pts.length-1]];
    const near=list=>{let best=null,bd=1e9;for(const x of list)for(const e of ends){const d=flat(x.pt,e);if(d<bd){bd=d;best=x}}return {best,bd}};
    // cocokkan homepass: nama rumah + FAT, lalu nama saja, lalu titik terdekat
    let cand=house?H.filter(h=>h.name===house&&(!fat||h.fat===fat)):[];
    if(!cand.length&&house) cand=H.filter(h=>h.name===house);
    let home=null;
    if(cand.length) home=near(cand).best;
    else{const n=near(H); if(n.best&&n.bd<15) home=n.best;}
    if(!fat){const n=near(fats); if(n.best&&n.bd<15) fat=n.best.name; else if(home) fat=home.fat}
    let len=0; for(let i=0;i<pts.length-1;i++) len+=dist(pts[i],pts[i+1]);
    len=Math.round(len*100)/100;
    const rec={cable,fat:fat||(home&&home.fat)||'-',len,pts};
    C.push(rec);
    if(home) home.cables.push(rec);
  }
  if(!C.length) throw new Error('Folder CABLE DROP kosong.');
  return {homes:H,cables:C,hpCount:HP.length,hpKeys};
}
async function readFile(file){
  const buf=await file.arrayBuffer();
  if(/\.kml$/i.test(file.name)) return new TextDecoder().decode(buf);
  if(!window.JSZip) throw new Error('Pustaka pembaca KMZ gagal dimuat. Muat ulang halaman.');
  const zip=await JSZip.loadAsync(buf);
  const entry=zip.file('doc.kml')||zip.file(/\.kml$/i)[0];
  if(!entry) throw new Error('Tidak ada file .kml di dalam KMZ.');
  return entry.async('string');
}

/* ---------- popup ---------- */
function popupHtml(h){
  let body;
  if(!h.cables.length){
    body='<p class="warn">Belum ada cable drop untuk homepass ini.</p>';
  }else{
    body=h.cables.map(c=>`<table>
      <tr><td>Cable drop</td><td>${esc(c.cable)}</td></tr>
      <tr><td>FAT</td><td>${esc(c.fat)}</td></tr>
      <tr><td>Panjang</td><td class="len">${fmt(c.len)} m</td></tr></table>`).join('<hr>');
  }
  return `<div class="pop"><h3>Homepass ${esc(h.name)}</h3>
    <table><tr><td>Blok</td><td>${esc(h.block||'-')}</td></tr><tr><td>Jalan</td><td>${esc(h.street)}</td></tr>
    <tr><td>FAT homepass</td><td>${esc(h.fat||'-')}</td></tr></table>${body}</div>`;
}
function popupPlain(h){ // untuk balon Google Earth
  const rows=h.cables.length?h.cables.map(c=>`<tr><td>Cable drop</td><td>${esc(c.cable)}</td></tr><tr><td>FAT</td><td>${esc(c.fat)}</td></tr><tr><td><b>Panjang</b></td><td><b>${fmt(c.len)} m</b></td></tr>`).join(''):'<tr><td colspan="2">Belum ada cable drop</td></tr>';
  return `<table><tr><td>Blok</td><td>${esc(h.block||'-')}</td></tr><tr><td>Jalan</td><td>${esc(h.street)}</td></tr><tr><td>FAT homepass</td><td>${esc(h.fat||'-')}</td></tr>${rows}</table>`;
}

/* ---------- map & list ---------- */
function initMap(){
  map=L.map('map',{preferCanvas:true}).setView([-6.2,106.8],12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
  lines=L.layerGroup().addTo(map); layer=L.layerGroup().addTo(map);
}
function filtered(){
  const q=$('q').value.trim().toLowerCase(), fat=$('fatSel').value;
  return homes.filter(h=>{
    const fats=[h.fat,...h.cables.map(c=>c.fat)];
    return (!fat||fats.includes(fat))&&(!q||[h.name,h.street,...fats,...h.cables.map(c=>c.cable)].some(s=>String(s).toLowerCase().includes(q)));
  });
}
function renderMap(list){
  layer.clearLayers(); lines.clearLayers(); markers.clear();
  const ll=[];
  for(const h of list){
    const has=h.cables.length>0;
    const m=L.circleMarker([h.pt[1],h.pt[0]],{radius:7,weight:2,color:has?'#0f6b6f':'#c2410c',fillColor:has?'#4fc1c5':'#f08a4b',fillOpacity:.85})
      .bindPopup(popupHtml(h),{maxWidth:300}).addTo(layer);
    markers.set(h,m); ll.push([h.pt[1],h.pt[0]]);
    for(const c of h.cables) L.polyline(c.pts.map(p=>[p[1],p[0]]),{color:'#c2410c',weight:2,opacity:.6}).addTo(lines);
  }
  if(ll.length) map.fitBounds(ll,{padding:[30,30],maxZoom:19});
}
function renderList(list){
  $('list').innerHTML=list.map((h,i)=>{
    const tot=h.cables.reduce((a,c)=>a+c.len,0);
    return `<div class="item" tabindex="0" data-i="${i}"><div><b>${esc(h.name)}</b><small>${esc(h.street)} · ${esc(h.fat||'-')}</small></div>
      <span class="m ${h.cables.length?'':'none'}">${h.cables.length?fmt(tot)+' m':'—'}</span></div>`}).join('');
  $('list').onclick=e=>{const it=e.target.closest('.item'); if(!it)return; focusHome(list[+it.dataset.i])};
  $('list').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.target.click()}};
  $('cnt').textContent=list.length+' dari '+homes.length+' homepass';
}
function focusHome(h){
  const m=markers.get(h); if(!m) return;
  map.setView(m.getLatLng(),Math.max(map.getZoom(),19)); m.openPopup();
}
function renderFats(){
  const keys=[...new Set(homes.flatMap(h=>[h.fat,...h.cables.map(c=>c.fat)]).filter(x=>x&&x!=='-'))].sort(natural.compare), sel=$('fatSel'), cur=sel.value;
  sel.innerHTML='<option value="">Semua FAT</option>'+keys.map(k=>`<option>${esc(k)}</option>`).join(''); sel.value=keys.includes(cur)?cur:'';
}
function refresh(){const l=filtered(); renderMap(l); renderList(l)}

/* ---------- load ---------- */
async function load(file){
  const st=$('status'); st.className=''; st.textContent='Membaca '+file.name+'...';
  try{
    const r=parseKml(await readFile(file));
    homes=r.homes; cables=r.cables; fileName=file.name;
    $('src').textContent='File: '+file.name; $('fatSel').value=''; $('q').value='';
    const withCable=homes.filter(h=>h.cables.length).length;
    const withBlock=homes.filter(h=>h.block).length;
    st.className='ok'; st.textContent='Berhasil: '+homes.length+' homepass, '+withCable+' sudah punya cable drop ('+cables.length+' kabel), '+withBlock+' punya blok. Klik titik untuk melihat pop up.';
    if(!withBlock){
      st.className='err';
      st.textContent+=' Blok kosong: '+(r.hpCount?('folder HP terbaca ('+r.hpCount+' titik) tapi tidak ada kolom BLOCK. Kolom yang ada: '+(r.hpKeys.join(', ')||'(tidak ada)')):'folder "HP" tidak ditemukan di file ini')+'.';
    }
    $('kmzBtn').disabled=false; $('csvBtn').disabled=false; renderFats(); refresh();
  }catch(e){st.className='err'; st.textContent=e.message||String(e)}
}

/* ---------- export KMZ dengan pop up (balon) per homepass ---------- */
function buildKml(){
  const x=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const pms=homes.map(h=>`<Placemark><name>${x(h.name)}</name><description><![CDATA[${popupPlain(h)}]]></description><Point><coordinates>${h.pt[0]},${h.pt[1]},0</coordinates></Point></Placemark>`).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Homepass Pop Up</name><Folder><name>HOMEPASS</name>\n${pms}\n</Folder></Document></kml>`;
}
$('kmzBtn').addEventListener('click',async()=>{
  const zip=new JSZip(); zip.file('doc.kml',buildKml());
  const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',mimeType:'application/vnd.google-earth.kmz'});
  const name=fileName.replace(/\.(kmz|kml)$/i,'')+'_homepass_popup.kmz';
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  $('status').className='ok'; $('status').textContent='KMZ diunduh: '+name;
});

/* ---------- export CSV (satu baris per homepass-kabel, mengikuti filter) ----------
   Kolom: A no | B nomor_homepass | C blok | D jalan | E fat_homepass |
          F gabungan (B C D E) | G panjang_kabel_m (panjang di KMZ + 30 m) | H latitude | I longitude */
const CABLE_EXTRA_M = 30;
function toCsv(list){
  const q=v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const head='No,ST NO,BLOK,ST NAME,FAT,GABUNGAN,PANJANG KABEL,LATITUDE,LONGITUDE';
  const out=[]; let n=0;
  const jalanOf=s=>s.replace(/^\s*JL\.?\s*/i,'').trim()||'-';
  for(const h of list){
    const nomor=h.name, blok=h.block||'', jalan=jalanOf(h.street), fat=h.fat||'-';
    const gabungan=[nomor,blok,jalan,fat].filter((v,i)=>v&&(i===1||v!=='-')).join(' ');
    const base=[q(nomor),q(blok),q(jalan),q(fat),q(gabungan)];
    const pos=[h.pt[1].toFixed(6),h.pt[0].toFixed(6)];
    if(!h.cables.length){out.push([++n,...base,'',...pos].join(','));continue}
    for(const c of h.cables) out.push([++n,...base,(c.len+CABLE_EXTRA_M).toFixed(2),...pos].join(','));
  }
  return '\ufeff'+[head].concat(out).join('\r\n');
}
/* ---------- jumpscare (tampil ~1,8 detik, klik layar untuk menutup) ---------- */
function jumpscare(){
  const el=$('scare'); el.classList.add('on');
  const off=()=>el.classList.remove('on');
  el.onclick=off; setTimeout(off,1800);
}
$('csvBtn').addEventListener('click',()=>{
  jumpscare();
  const csv=toCsv(filtered());
  const name=fileName.replace(/\.(kmz|kml)$/i,'')+'_homepass.csv';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=name; document.body.appendChild(a); a.click(); a.remove();
  $('status').className='ok'; $('status').textContent='CSV diunduh: '+name;
});

/* ---------- events ---------- */
['q','fatSel'].forEach(id=>$(id).addEventListener('input',refresh));
$('file').addEventListener('change',e=>{if(e.target.files[0]) load(e.target.files[0]); e.target.value=''});
$('pick').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}});
const dz=$('drop');
['dragenter','dragover'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('over')}));
dz.addEventListener('drop',e=>{const f=e.dataTransfer.files[0]; if(f) load(f)});
window.addEventListener('dragover',e=>e.preventDefault()); window.addEventListener('drop',e=>e.preventDefault());
initMap();
</script>
