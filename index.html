<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panjang Cable Drop</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: lembar survei jaringan. Strip upload di atas, ringkasan angka, dua grafik (per FAT, sebaran panjang), lalu tabel kabel yang bisa dicari. */
:root{
  --bg:#eef1f3; --surface:#ffffff; --surface2:#f5f7f8; --ink:#14232b; --muted:#5b6b74;
  --line:#d5dde1; --accent:#c2410c; --accent-soft:#fbe3d6; --teal:#0f6b6f; --teal-soft:#d3ebeb;
  --warn:#a16207; --warn-soft:#fdf0c9; --ok:#17693a;
  --font-display:'IBM Plex Sans Condensed','Arial Narrow',Arial,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f181d; --surface:#17232a; --surface2:#1d2c34; --ink:#e6edf0; --muted:#97a8b1;
    --line:#2b3c45; --accent:#f08a4b; --accent-soft:#3a2418; --teal:#4fc1c5; --teal-soft:#16373a;
    --warn:#e7b94a; --warn-soft:#3a3016; --ok:#5fcf8a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f181d; --surface:#17232a; --surface2:#1d2c34; --ink:#e6edf0; --muted:#97a8b1;
  --line:#2b3c45; --accent:#f08a4b; --accent-soft:#3a2418; --teal:#4fc1c5; --teal-soft:#16373a;
  --warn:#e7b94a; --warn-soft:#3a3016; --ok:#5fcf8a; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;
  padding-inline:0;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:24px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-family:var(--font-mono);font-size:12px;overflow-wrap:anywhere}
h2{font-family:var(--font-display);font-weight:600;font-size:16px;margin:0 0 12px;letter-spacing:.01em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}

/* upload */
.drop{display:flex;flex-wrap:wrap;align-items:center;gap:14px;border:1.5px dashed var(--muted);border-radius:6px;
  padding:16px;background:var(--surface);transition:background .15s,border-color .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .txt{flex:1 1 260px;min-width:0}
.drop strong{font-family:var(--font-display);font-size:17px;font-weight:600}
.drop p{margin:2px 0 0;color:var(--muted)}
button,.btn{font:inherit;font-weight:500;border-radius:5px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);
  padding:8px 14px;cursor:pointer}
button.ghost,.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#status{font-family:var(--font-mono);font-size:12.5px;min-height:18px;color:var(--muted)}
#status.err{color:var(--accent)} #status.ok{color:var(--ok)}

/* table */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
input[type=search],input[type=number],select{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);
  border-radius:5px;padding:7px 9px;min-width:0}
input[type=search]{width:220px;max-width:100%} input[type=number]{width:90px}
.spacer{flex:1 1 auto}
.tablebox{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:5px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--surface2);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);cursor:pointer;user-select:none}
th[aria-sort]{color:var(--ink)}
th .ar{color:var(--accent)}
td.num,th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
td.mono{font-family:var(--font-mono);font-size:12.5px}
.count{color:var(--muted);font-size:12.5px}
</style>
</head>

</div>

const COLS = [
  {k:'no',l:'No',num:true},{k:'cable',l:'Cable drop'},{k:'house',l:'Nomor rumah'},
  {k:'fat',l:'FAT'},{k:'street',l:'Jalan'},{k:'len',l:'Panjang (m)',num:true}

let sort = {k:'no',dir:1}, fileName='ABD-RB32DPK1128_001.kmz';
const $ = id => document.getElementById(id);
const fmt = (n,d=2) => n.toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const natural = new Intl.Collator('id',{numeric:true,sensitivity:'base'});

/* ---------- geodesic length (Vincenty, WGS84) ---------- */
function dist(p1,p2){
  const a=6378137, f=1/298.257223563, b=a*(1-f), rad=Math.PI/180;
  if(p1[0]===p2[0]&&p1[1]===p2[1]) return 0;
  const U1=Math.atan((1-f)*Math.tan(p1[1]*rad)), U2=Math.atan((1-f)*Math.tan(p2[1]*rad));
  const L=(p2[0]-p1[0])*rad; let lam=L, sS,cS,s,c2a,c2sm;
  for(let i=0;i<200;i++){
    sS=Math.hypot(Math.cos(U2)*Math.sin(lam),Math.cos(U1)*Math.sin(U2)-Math.sin(U1)*Math.cos(U2)*Math.cos(lam));
    cS=Math.sin(U1)*Math.sin(U2)+Math.cos(U1)*Math.cos(U2)*Math.cos(lam);
    s=Math.atan2(sS,cS);
    const sa=Math.cos(U1)*Math.cos(U2)*Math.sin(lam)/sS; c2a=1-sa*sa;
    c2sm=c2a?cS-2*Math.sin(U1)*Math.sin(U2)/c2a:0;
    const C=f/16*c2a*(4+f*(4-3*c2a)), lp=lam;
    lam=L+(1-C)*f*sa*(s+C*sS*(c2sm+C*cS*(-1+2*c2sm*c2sm)));
    if(Math.abs(lam-lp)<1e-12) break;
  }
  const u2=c2a*(a*a-b*b)/(b*b);
  const A=1+u2/16384*(4096+u2*(-768+u2*(320-175*u2)));
  const B=u2/1024*(256+u2*(-128+u2*(74-47*u2)));
  const ds=B*sS*(c2sm+B/4*(cS*(-1+2*c2sm*c2sm)-B/6*c2sm*(-3+4*sS*sS)*(-3+4*c2sm*c2sm)));
  return b*A*(s-ds);
}
const flat=(p,q)=>Math.hypot((p[0]-q[0])*110500,(p[1]-q[1])*111320);

/* ---------- KML parsing ---------- */
const kids=(el,t)=>Array.from(el.children).filter(c=>c.localName===t);
const nameOf=el=>{const n=kids(el,'name')[0];return n?n.textContent.trim():''};
function coords(pm){
  const c=pm.getElementsByTagNameNS('*','coordinates')[0]; if(!c) return [];
  return c.textContent.trim().split(/\s+/).map(s=>s.split(',').slice(0,2).map(Number)).filter(p=>p.length===2&&!p.some(isNaN));
}
function attrs(pm){const o={};for(const s of pm.getElementsByTagNameNS('*','SimpleData'))o[s.getAttribute('name')]=s.textContent.trim();return o}
function parseKml(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.getElementsByTagNameNS('*','parsererror').length) throw new Error('Isi KML tidak bisa dibaca.');
  const folders=Array.from(doc.getElementsByTagNameNS('*','Folder'));
  const byName=re=>folders.filter(f=>re.test(nameOf(f)));
  const drop=byName(/^cable[\s_-]*drop$/i)[0];
  if(!drop) throw new Error('Folder "CABLE DROP" tidak ditemukan. Folder yang ada: '+folders.map(nameOf).join(', '));
  const homes=[];
  for(const f of byName(/^home(-biz)?$/i)) for(const pm of f.getElementsByTagNameNS('*','Placemark')){
    const c=coords(pm)[0]; if(!c) continue; const a=attrs(pm);
    homes.push({name:nameOf(pm),pt:c,street:((a.PREFIX_ADDRESS||'')+' '+(a.STREET_NAME||'')).trim(),fat:a.FAT_CODE||''});
  }
  const fats=[];
  for(const f of byName(/^fat$/i)) for(const pm of f.getElementsByTagNameNS('*','Placemark')){
    const c=coords(pm)[0]; if(c) fats.push({name:nameOf(pm),pt:c});
  }
  const out=[];
  for(const pm of drop.getElementsByTagNameNS('*','Placemark')){
    const pts=coords(pm); if(pts.length<2) continue;
    const cable=nameOf(pm); const m=cable.match(/^cable_(.+)_(FOB\w+)$/i);
    let house=m?m[1]:'', fat=m?m[2]:'';
    const ends=[pts[0],pts[pts.length-1]];
    const near=(list)=>{let best=null,bd=1e9;for(const x of list)for(const e of ends){const d=flat(x.pt,e);if(d<bd){bd=d;best=x}}return {best,bd}};
    let cand=house?homes.filter(h=>h.name===house):[];
    let home=null;
    if(cand.length){home=near(cand).best}
    else{const n=near(homes); if(n.best&&n.bd<15){home=n.best;house=house||home.name}}
    if(!fat){const n=near(fats); if(n.best&&n.bd<15) fat=n.best.name; else if(home) fat=home.fat}
    let len=0; for(let i=0;i<pts.length-1;i++) len+=dist(pts[i],pts[i+1]);
    out.push({cable,house:house||'-',fat:fat||'-',street:home?home.street:'-',len:Math.round(len*100)/100});
  }
  if(!out.length) throw new Error('Folder CABLE DROP kosong.');
  return out.map((r,i)=>({...r,no:i+1}));
}
async function readFile(file){
  const buf=await file.arrayBuffer();
  if(/\.kml$/i.test(file.name)) return new TextDecoder().decode(buf);
  if(!window.JSZip) throw new Error('Pustaka pembaca KMZ gagal dimuat. Muat ulang halaman.');
  const zip=await JSZip.loadAsync(buf);
  const entry=zip.file('doc.kml')||zip.file(/\.kml$/i)[0];
  if(!entry) throw new Error('Tidak ada file .kml di dalam KMZ.');
  return entry.async('string');
}
async function load(file){
  const st=$('status'); st.className=''; st.textContent='Membaca '+file.name+'...';
  try{
    rows=parseKml(await readFile(file)); fileName=file.name;
    $('src').textContent='File: '+file.name; $('fatSel').value=''; $('q').value='';
    st.className='ok'; st.textContent='Berhasil: '+rows.length+' cable drop dibaca dari '+file.name+'.';
    renderAll();
  }catch(e){st.className='err'; st.textContent=e.message||String(e)}
}

/* ---------- render ---------- */
function filtered(){
  const q=$('q').value.trim().toLowerCase(), fat=$('fatSel').value;
  let r=rows.filter(x=>(!fat||x.fat===fat)&&(!q||[x.cable,x.house,x.fat,x.street].some(s=>s.toLowerCase().includes(q))));
  const {k,dir}=sort;
  r=[...r].sort((a,b)=>(typeof a[k]==='number'?a[k]-b[k]:natural.compare(String(a[k]),String(b[k])))*dir||a.no-b.no);
  return r;
}
function renderFats(){
  const keys=[...new Set(rows.map(r=>r.fat))].sort(natural.compare), sel=$('fatSel'), cur=sel.value;
  sel.innerHTML='<option value="">Semua FAT</option>'+keys.map(k=>`<option>${esc(k)}</option>`).join(''); sel.value=keys.includes(cur)?cur:'';
}
function renderTable(){
  $('thead').innerHTML=COLS.map(c=>{const on=sort.k===c.k;
    return `<th data-k="${c.k}" class="${c.num?'num':''}" tabindex="0" ${on?`aria-sort="${sort.dir>0?'ascending':'descending'}"`:''}>${c.l}${on?`<span class="ar"> ${sort.dir>0?'▲':'▼'}</span>`:''}</th>`}).join('');
  const r=filtered();
  $('tbody').innerHTML=r.map(x=>{return `<tr><td class="num">${x.no}</td><td class="mono">${esc(x.cable)}</td><td class="mono">${esc(x.house)}</td>
    <td class="mono">${esc(x.fat)}</td><td>${esc(x.street)}</td><td class="num">${fmt(x.len)}</td></tr>`}).join('');
  const sum=r.reduce((a,b)=>a+b.len,0);
  $('cnt').textContent=r.length+' dari '+rows.length+' kabel, total '+fmt(sum)+' m';
}
function renderAll(){renderFats();renderTable()}

/* ---------- events ---------- */
$('thead').addEventListener('click',e=>{const th=e.target.closest('th'); if(!th)return;
  const k=th.dataset.k; sort=sort.k===k?{k,dir:-sort.dir}:{k,dir:1}; renderTable()});
$('thead').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.target.click()}});
['q','fatSel'].forEach(id=>$(id).addEventListener('input',renderTable));
$('file').addEventListener('change',e=>{if(e.target.files[0]) load(e.target.files[0]); e.target.value=''});
$('pick').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}});
const drop=$('drop');
['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0]; if(f) load(f)});
window.addEventListener('dragover',e=>e.preventDefault()); window.addEventListener('drop',e=>e.preventDefault());

function toCsv(list){
  const q=v=>/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
  return '﻿'+['no,nama_cable_drop,nomor_rumah,fat,jalan,panjang_kabel_m']
    .concat(list.map((r,i)=>[i+1,q(r.cable),q(r.house),q(r.fat),q(r.street),r.len.toFixed(2)].join(','))).join('\r\n');
}
$('csvBtn').addEventListener('click',()=>{
  const csv=toCsv(filtered()), note=$('csvNote');
  const name=fileName.replace(/\.(kmz|kml)$/i,'')+'_cable_drop.csv';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=name; document.body.appendChild(a); a.click(); a.remove();
  note.textContent='CSV diunduh: '+name;
});
renderAll();
